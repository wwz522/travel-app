spring:
  application:
    name: tripmate-backend
  
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/tripmate?useSSL=false&serverTimezone=Asia/Shanghai}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:Ggr68729!}
    hikari:
      connection-timeout: 30000  # 连接超时30秒
      maximum-pool-size: 10      # 最大连接数
      minimum-idle: 5            # 最小空闲连接数
      idle-timeout: 600000       # 空闲连接超时10分钟
      max-lifetime: 1800000      # 连接最大生命周期30分钟
  
  sql:
    init:
      mode: never
  
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
      enabled: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.tripmate.entity

server:
  port: ${PORT:8081}  # 优先使用环境变量 PORT，如果没有则使用 8081
  servlet:
    context-path: /api

jwt:
  secret: ${JWT_SECRET:tripmate-secret-key-2024-very-long-secret-key-for-jwt-token-generation}
  expiration: ${JWT_EXPIRATION:604800000}

file:
  upload:
    path: ./uploads/
    url-prefix: /uploads/

ai:
  qianwen:
    api-key: ${AI_QIANWEN_API_KEY:sk-132ad81a355943549e0d0a3da0652f3e}
    api-url: ${AI_QIANWEN_API_URL:https://dashscope.aliyuncs.com/api/v1/services/aigc/text-generation/generation}
